[project]
name = "rutasur-api"
version = "0.2.0"
description = "RutaSur v1.0 — servicio en la nube: API REST de seguimiento de buses del Cono Sur de Arequipa"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Pierre Xavi Stephan Núñez Aco" }]
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "sqlalchemy==2.0.*",
    "psycopg[binary]==3.2.*",
    "pydantic-settings==2.6.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "pytest-cov==6.0.*",
    "httpx==0.27.*",
    "ruff==0.7.*",
    "bandit==1.7.*",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ----------------------------------------------------------
# Ruff: estilo (PEP 8) y análisis estático
# ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes: errores lógicos, imports sin usar
    "I",        # orden de imports
    "N",        # nombres según PEP 8
    "B",        # bugbear: errores frecuentes
    "C90",      # complejidad ciclomática
    "UP",       # sintaxis moderna de Python
    "S",        # seguridad (reglas de Bandit)
    "SIM",      # simplificaciones
    "RET",      # retornos coherentes
]
ignore = [
    "B008",     # FastAPI usa Depends() como valor por defecto, es el patrón oficial
    "N818",     # Convención del proyecto: excepciones en español con prefijo "Error..."
                # o nombre descriptivo (RecursoNoEncontrado), no con sufijo inglés "Error"
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert es la forma normal de verificar en pytest

# ----------------------------------------------------------
# Pytest
# ----------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: prueba que necesita la base de datos PostgreSQL + PostGIS en marcha",
]
addopts = "-ra"
filterwarnings = [
    # Aviso interno de la librería de pruebas de Starlette; no corresponde a código del proyecto
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/herramientas/*"]

# ----------------------------------------------------------
# Bandit: análisis de seguridad
# ----------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
