# ==========================================================
# RutaSur v1.0 — instalables de Android (APK)
# Compila la app del pasajero y la del conductor contra el servicio en la nube y
# deja los .apk como artefactos de la ejecución: se descargan desde la pestaña
# Actions → esta ejecución → Artifacts, y se instalan en el teléfono.
# Se firman con la clave propia de RutaSur si están los secretos
# RUTASUR_KEYSTORE_BASE64 y RUTASUR_KEYSTORE_PASSWORD (docs/firma-apk.md). Así cada
# versión nueva se instala encima de la anterior sin desinstalar. Sin ellos, se
# firman con la clave de depuración y el resumen lo advierte.
# ==========================================================
name: APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ["app/**", ".github/workflows/apk.yml"]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: https://rutasur-api.onrender.com
  RUTASUR_KEYSTORE_PASSWORD: ${{ secrets.RUTASUR_KEYSTORE_PASSWORD }}

jobs:
  apk:
    name: APK pasajero y conductor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Clave de firma
        env:
          ALMACEN_BASE64: ${{ secrets.RUTASUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ALMACEN_BASE64" ] || [ -z "$RUTASUR_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Sin los secretos de la clave propia: los APK se firman con la clave de depuración."
            exit 0
          fi
          echo "$ALMACEN_BASE64" | base64 -d > "$RUNNER_TEMP/rutasur.jks"
          echo "RUTASUR_KEYSTORE=$RUNNER_TEMP/rutasur.jks" >> "$GITHUB_ENV"

      - name: APK del conductor
        run: |
          set -o pipefail
          flutter build apk --release --flavor conductor \
            -t lib/entrypoints/main_conductor.dart \
            --dart-define=API_URL=$API_URL 2>&1 | tee ../compilacion.log

      - name: APK del pasajero
        run: |
          set -o pipefail
          flutter build apk --release --flavor pasajero \
            -t lib/entrypoints/main_pasajero.dart \
            --dart-define=API_URL=$API_URL 2>&1 | tee ../compilacion.log

      - name: Nombres con la versión
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mkdir -p ../instalables
          cp build/app/outputs/flutter-apk/app-conductor-release.apk ../instalables/rutasur-conductor-$VERSION.apk
          cp build/app/outputs/flutter-apk/app-pasajero-release.apk ../instalables/rutasur-pasajero-$VERSION.apk
          ls -la ../instalables

      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in ../instalables/*.apk; do
            echo "== $(basename "$apk")"
            "$APKSIGNER" verify --print-certs "$apk" | grep -E "certificate DN|SHA-256"
          done | tee firma.txt
          if grep -q "CN=Android Debug" firma.txt; then
            echo "### ⚠️ Firmados con la clave de depuración" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Firmados con la clave propia de RutaSur" >> "$GITHUB_STEP_SUMMARY"
          fi
          sed 's/^/    /' firma.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Errores de la compilación
        if: failure()
        run: python3 ../.github/scripts/errores_gradle.py ../compilacion.log

      - uses: actions/upload-artifact@v4
        with:
          name: rutasur-apk
          path: instalables/*.apk
          retention-days: 30
