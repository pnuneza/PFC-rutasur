# Análisis estático de Dart: reglas de Effective Dart (flutter_lints) más algunas propias.
# Se ejecuta con `flutter analyze` y en la integración continua.
analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    prefer_single_quotes: true
    prefer_final_locals: true
    require_trailing_commas: false
    sort_child_properties_last: true
